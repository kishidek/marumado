<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <meta name="color-scheme" content="light dark" />
  </head>
  <body>
    <div id="scene" aria-hidden="true"></div>
    <!-- Shown only when WebGL is unavailable: a CSS version of the round window. -->
    <div id="fallback" hidden>
      <div class="fb-window"><div class="fb-ridge"></div></div>
      <p id="fallbackNote">3D is turned off in this browser. Your plant is fine; everything else works.</p>
    </div>

    <main class="ui">
      <!-- Left column: stacks clock, question and plant panel so they never overlap. -->
      <div class="left">
      <header class="clock">
        <time id="time"></time>
        <p id="date"></p>
        <p id="greeting"></p>
      </header>

      <!-- Both start hidden: they appear only once stored data has loaded (no empty flash). -->
      <section class="ask gone" id="ask" aria-live="polite"></section>

      <!-- The slot holds the collapsed pill's height; the panel expands upward over the column. -->
      <div class="needs-slot">
      <section class="needs" id="needs" aria-labelledby="needsTitle" tabindex="0" hidden>
        <h2 id="needsTitle"><span id="plantName"></span> <small id="plantMeta"></small><span class="minis" id="needsMini" aria-hidden="true"></span></h2>
        <ul id="needsList"></ul>
      </section>
      </div>
      </div>

      <button type="button" class="icon-btn help-btn" id="openHelp" aria-label="How Marumado works" hidden></button>
      <button type="button" class="icon-btn settings-btn" id="openSettings" aria-label="Settings" hidden></button>
    </main>

    <div class="toast" id="toast" role="status"></div>

    <!-- Settings drawer -->
    <div class="scrim" id="settingsScrim" hidden></div>
    <aside class="drawer" id="settings" aria-labelledby="settingsTitle" hidden>
      <header>
        <h2 id="settingsTitle">Settings</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close settings"></button>
      </header>
      <div class="drawer-body" id="settingsBody"></div>
    </aside>

    <!-- How it works -->
    <div class="modal-wrap" id="help" hidden>
      <div class="modal help" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
        <header class="help-head">
          <h2 id="helpTitle">How Marumado works</h2>
          <button type="button" class="icon-btn" id="closeHelp" aria-label="Close"></button>
        </header>
        <video id="helpVideo" src="media/explainer.webm" muted loop playsinline preload="none" aria-label="The ajisai at five ages: it wilts without care and comes back with care"></video>
        <ul class="help-points" id="helpPoints"></ul>
      </div>
    </div>

    <!-- First-run onboarding -->
    <div class="modal-wrap" id="onboarding" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="obTitle">
        <ol class="steps" id="obSteps" aria-label="Setup progress"></ol>
        <div id="obBody"></div>
        <footer>
          <button type="button" class="btn ghost" id="obBack">Back</button>
          <button type="button" class="btn primary" id="obNext">Continue</button>
        </footer>
      </div>
    </div>

    <!-- Dev-only review controls (removed in production builds) -->
    <details class="mock-controls" id="mockControls" hidden>
      <summary>Dev controls</summary>
      <div id="mockBody"></div>
    </details>

    <script type="module" src="./boot.ts"></script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
